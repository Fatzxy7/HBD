<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sayang ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }
    .book {
      width: 320px;
      height: 420px;
      perspective: 1000px;
      position: relative;
    }
    .page {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      position: absolute;
      transform-origin: left;
      transition: transform 1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .page img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .page h2 {
      color: #ff4d6d;
      margin: 10px 0;
    }
    .page p {
      font-size: 14px;
      color: #333;
    }
    .page:nth-child(1) { z-index: 4; }
    .page:nth-child(2) { z-index: 3; }
    .page:nth-child(3) { z-index: 2; }
    .page:nth-child(4) { z-index: 1; }
    .page.flipped {
      transform: rotateY(-180deg);
      z-index: 0;
    }
    button {
      margin-top: 20px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #ff3355;
    }
  </style>
</head>
<body>

  <div class="book" id="book">
    <div class="page">
      <h2>🎂 Happy 32nd Birthday Sayang ❤️</h2>
      <p>Hari ini spesial banget, kamu resmi berusia 32 tahun 🎉</p>
      <button onclick="flipPage(0)">Next ➡️</button>
    </div>
    <div class="page">
      <img src="https://source.unsplash.com/300x200/?cake" alt="cake">
      <h2>Semoga Bahagia</h2>
      <p>Semoga setiap langkahmu penuh senyum & tawa 😊</p>
      <button onclick="flipPage(1)">Next ➡️</button>
    </div>
    <div class="page">
      <img src="https://source.unsplash.com/300x200/?love" alt="love">
      <h2>Aku Bersyukur</h2>
      <p>Aku bersyukur bisa punya kamu di hidupku 💕</p>
      <button onclick="flipPage(2)">Next ➡️</button>
    </div>
    <div class="page">
      <h2>💖 I Love You 💖</h2>
      <p>Selamat ulang tahun, semoga kita selalu bersama selamanya ✨</p>
      <button onclick="resetBook()">↩️ Balik Lagi</button>
    </div>
  </div>

  <audio id="bgm" autoplay loop>
    <source src="lagu.mp3" type="audio/mpeg">
  </audio>

  <script>
    let pages = document.querySelectorAll('.page');
    function flipPage(i) {
      pages[i].classList.add('flipped');
    }
    function resetBook() {
      pages.forEach(p => p.classList.remove('flipped'));
    }
  </script>

</body>
</html>
